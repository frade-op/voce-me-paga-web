<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Leia sua nota fiscal e veja os itens da compra. A nota lida. A conta dividida."
    />
    <meta name="theme-color" content="#064e3b" />
    <title>vc me paga — A nota lida. A conta dividida.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Dividir fica mais fácil</p>
          <h1>vc me paga</h1>
          <p class="tagline">A nota lida. A conta dividida.</p>
          <p class="subtitle">
            Cole o link da nota fiscal para conferir os itens da compra.
          </p>
        </div>
        <img
          class="brand-art"
          src="images/logo.png"
          alt="Logo vc me paga: conversa, nota fiscal e setas verdes"
          width="2000"
          height="3000"
        />
      </header>

      <section class="lookup-card" aria-labelledby="lookup-title">
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">01</span>
          <div>
            <h2 id="lookup-title">Comece pela nota</h2>
            <p class="section-description">Use o link do QR Code da NFC-e.</p>
          </div>
        </div>

        <form id="invoice-form">
          <label class="visually-hidden" for="invoice-url">Link da nota fiscal</label>
          <input
            id="invoice-url"
            type="url"
            placeholder="https://... (link do QR Code da NFC-e)"
            required
          />
          <button id="submit-btn" type="submit">Ler nota</button>
        </form>

        <p id="status" role="status" aria-live="polite" hidden></p>
      </section>

      <section id="result" class="result-card" aria-label="Dados da nota fiscal" hidden>
        <div id="invoice-info" class="info"></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Código</th>
                <th class="num">Qtd</th>
                <th>Un</th>
                <th class="num">Preço un.</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody id="items"></tbody>
            <tfoot id="totals"></tfoot>
          </table>
        </div>
        <div id="payments"></div>
      </section>

      <footer class="page-footer">Feito para dividir a conta sem complicação.</footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
